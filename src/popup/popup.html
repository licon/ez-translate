<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="popupTitle"></title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>EZ Translate</h1>
        <div class="input-container">
            <textarea id="text-input" rows="5" data-i18n-placeholder="textInputPlaceholder"></textarea>
            <button id="speak-input-button" class="speak-button" style="display: none;">&#128266;</button>
        </div>
        <div class="actions">
            <select id="target-language">
            </select>
            <button id="translate-button" data-i18n="translateButton"></button>
        </div>
        <div class="result-container" id="result-container">
            <p id="translation-result"></p>
            <div class="result-actions">
                <button id="copy-button" class="speak-button" style="display: none;">&#x1f4cb;</button>
                <button id="speak-button" class="speak-button" style="display: none;">&#128266;</button>
            </div>
        </div>
        <div class="settings-container">
            <div class="setting-item">
                <label for="selection-translate-toggle" data-i18n="selectionTranslateLabel"></label>
                <label class="switch">
                    <input type="checkbox" id="selection-translate-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="right-icons">
                <button id="screenshot-translate-button" class="icon-button" data-i18n-title="screenshotTranslateButton" title="Image Translate">📸</button>
                <button id="settings-icon-button" class="icon-button" data-i18n-title="settingsLink" title="Settings">⚙️</button>
            </div>
        </div>
        <details class="selection-settings">
            <summary data-i18n="selectionSettingsLabel"></summary>
            <div class="selection-setting-item">
                <label for="disable-editable-toggle" data-i18n="disableTranslationInEditableLabel"></label>
                <label class="switch">
                    <input type="checkbox" id="disable-editable-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="selection-setting-item">
                <label for="auto-translate-toggle" data-i18n="translateOnSelectionLabel"></label>
                <label class="switch">
                    <input type="checkbox" id="auto-translate-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="selection-setting-item">
                <label for="require-ctrl-toggle" data-i18n="requireCtrlOnSelectionLabel"></label>
                <label class="switch">
                    <input type="checkbox" id="require-ctrl-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <p id="combined-selection-hint" class="combined-selection-hint" data-i18n="combinedSelectionHint" hidden></p>
        </details>
    </div>
    <script src="popup.js"></script>
</body>
</html>
